name: Browser E2E verification

# Runs reproducible Playwright Chromium verification against TPL-E01-06
# Formal Document Master whenever its source, built HTML, or E2E test changes.

on:
  pull_request:
    paths:
      - "tools/document-master/**"
      - "tools/build_document_master.py"
      - "tools/e2e/**"
      - "Standards Design/03_Templates/TPL-E01-06_Formal-Document-Master.html"
      - ".github/workflows/browser-e2e.yml"
  push:
    branches: [main]
    paths:
      - "tools/document-master/**"
      - "tools/e2e/**"
      - "Standards Design/03_Templates/TPL-E01-06_Formal-Document-Master.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright & Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify TPL-E01-06 Formal Document Master in Chromium
        run: |
          set -o pipefail
          node tools/e2e/verify_document_master.mjs --export-pdf /tmp/tpl-e01-06-digital.pdf 2>&1 | tee /tmp/e2e.log

      - name: Publish E2E summary
        if: always()
        run: |
          echo "### TPL-E01-06 Browser E2E Verification" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/e2e.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
