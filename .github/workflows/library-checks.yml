name: Library checks

# Measures Standards Design on every pull request and every change
# to main. A failing finding that is not listed in tools/known-issues.json turns
# the run red. The report is kept as a run artifact so governance records can cite it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  library-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Test tools
        run: python3 -m unittest discover -s tools/tests -v

      - name: Run library checks
        run: python3 tools/library_checks.py --report-dir check-report

      - name: Publish summary
        if: always()
        run: |
          if [ -f check-report/check-report.md ]; then
            cat check-report/check-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment A04 §5.1.7 citation on PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY' > /tmp/pr-comment.md
          import json, os, pathlib
          p = pathlib.Path("check-report/check-report.json")
          run_id, run_url, sha = os.environ["RUN_ID"], os.environ["RUN_URL"], os.environ["HEAD_SHA"]
          short = sha[:7]
          if p.exists():
              d = json.loads(p.read_text(encoding="utf-8"))
              m = d.get("meta", {})
              verdict = str(m.get("verdict", "unknown")).upper()
              total = len(d.get("checks", []))
              fails = m.get("failing_findings", 0)
              known = m.get("known_issue_findings", 0)
          else:
              verdict, total, fails, known = "ERROR", 0, 1, 0
          print("<!-- library-checks-citation -->")
          print(f"### Library checks: `{verdict}` ({total} checks, {fails} failing, {known} known)")
          print()
          print(f"- **Commit:** `{short}` (`{sha}`)")
          print(f"- **CI Run:** [`{run_id}`]({run_url})")
          print()
          print("Cite in `REC-A04-0xx` (`A04 §5.1.7`):")
          print("```sh")
          print(f'python3 tools/new_rec.py --cite-ci "Standards Design/05_Records/REC-A04-0xx_....md" --ci-run "{run_url}" --commit "{short}"')
          print("```")
          PY
          CID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUM}/comments" --jq '.[] | select(.body | contains("<!-- library-checks-citation -->")) | .id' | head -n1)
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${CID}" -F body=@/tmp/pr-comment.md >/dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUM}/comments" -F body=@/tmp/pr-comment.md >/dev/null
          fi

      - name: Build @irvantri/design-system dist bundle
        run: python3 tools/build_tokens_exports.py --out-dir dist

      - name: Keep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-check-report-${{ github.sha }}
          path: check-report/
          retention-days: 400

      - name: Upload design-system dist bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: irvantri-design-system-${{ github.sha }}
          path: dist/
          retention-days: 90
