name: Publish to Google Drive

# One-way publish of Standards Design/ from GitHub main to the Google Drive
# Distribution Mirror and append-only 99_Archive/ Cold Archive (A01 §5.9.3).
#
# Runs on every push to main that changes Standards Design/ (that is, every
# merged pull request), after Library checks pass on the same commit. After a
# successful publish it creates the annotated release tag register-vX.Y.Z for
# the Library-Index.md version (A01 §5.7.2) if that tag does not exist yet.
#
# Authentication: OAuth 2.0 refresh token of the library Owner's Google account
# (a service account cannot create files in a personal My Drive). Repository
# secrets, created once with tools/drive_oauth_token.py (see tools/README.md):
#   GDRIVE_OAUTH_CLIENT_ID, GDRIVE_OAUTH_CLIENT_SECRET, GDRIVE_OAUTH_REFRESH_TOKEN

on:
  push:
    branches: [main]
    paths:
      - "Standards Design/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview planned Drive changes without modifying files"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Publishes run one at a time, in merge order; a queued run is never cancelled mid-way.
concurrency:
  group: drive-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: python3 tools/library_checks.py --report-dir check-report

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # release tag only
    env:
      GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
      GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
      GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
      STANDARDS_DESIGN_DRIVE_ID: "17-hTsw-2MIT-SzA6pRgzocpKTy1vwYin"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check credentials
        id: creds
        run: |
          if [ -z "$GDRIVE_OAUTH_REFRESH_TOKEN" ] || [ -z "$GDRIVE_OAUTH_CLIENT_ID" ] || [ -z "$GDRIVE_OAUTH_CLIENT_SECRET" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Drive OAuth secrets are not configured; nothing was published. See tools/README.md."
            echo "Drive OAuth secrets are not configured; nothing was published. See \`tools/README.md\` → *Publishing one-way to Google Drive*." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.creds.outputs.configured == 'true'
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          MODE=--apply
          if [ "$DRY_RUN" = "true" ]; then MODE=--dry-run; fi
          python3 tools/publish_drive.py --backend api $MODE --archive-policy versioned --summary "$GITHUB_STEP_SUMMARY"

      - name: Tag register release
        if: steps.creds.outputs.configured == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          VERSION=$(grep -m1 -oP '^\|\s*\*\*Version\*\*\s*\|\s*`\Kv\d+\.\d+\.\d+' "Standards Design/Library-Index.md")
          TAG="register-${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; not re-tagging." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Standards Design ${TAG} (Library-Index.md ${VERSION}), published to Google Drive by run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin "refs/tags/${TAG}"
          echo "Created release tag \`${TAG}\` at \`${GITHUB_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
