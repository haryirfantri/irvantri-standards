  <title id="title-ast-b01-05">Irvantri Standards — Primary Master Lockup (Full-Color Primary)</title>
  <desc id="desc-ast-b01-05">AST-B01-05 master vector lockup (800 x 160, 5:1) for light surfaces, aligned to B01 (v2.0.0), B02 (v1.2.0), and B03 (v2.0.0). Combines verbatim AST-B01-01 Primary Symbol with the curve-outlined Noto Sans Display ExtraBold wordmark (IRVANTRI STANDARDS) from AST-B01-03, set on one line and uniformly scaled; no Endorsement Line. Minimum width: 140 px digital / 38 mm print; Clear Space: 0.25x symbol width on all four sides.</desc>
